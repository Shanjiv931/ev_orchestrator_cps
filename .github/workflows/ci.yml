name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16-all
        env:
          POSTGRES_USER: ev
          POSTGRES_PASSWORD: ev
          POSTGRES_DB: ev_orchestrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Pending (not-yet-OTP-verified) registrations live in Redis, not
      # Postgres - see backend/app/pending_registration.py - so the test
      # suite now needs a real Redis to talk to, same as it already needs
      # Postgres.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Enable required Postgres extensions
        run: |
          PGPASSWORD=ev psql -h localhost -U ev -d ev_orchestrator_test -c \
            "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS timescaledb;"
      - name: Run backend tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulation dependencies
        working-directory: simulation
        run: pip install -r requirements.txt
      - name: Run simulation tests
        working-directory: simulation
        run: pytest tests/

  twin-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install twin-engine dependencies
        working-directory: twin-engine
        run: pip install -r requirements.txt
      - name: Run twin-engine tests
        working-directory: twin-engine
        run: pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend-web
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend-web
        run: npm run test
      - name: Type-check and build
        working-directory: frontend-web
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config
